<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FEF08A"/>
      <stop offset="40%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FEF08A"/>
      <stop offset="50%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="shimmer" cx="42%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="panfill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="cc"><circle cx="50" cy="50" r="43"/></clipPath>
  </defs>

  <!-- ── Badge rings ── -->
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="50"   fill="url(#gold)"/>
  <!-- Dark separator band -->
  <circle cx="50" cy="50" r="45.8" fill="#060C18"/>
  <!-- Thin gold accent ring -->
  <circle cx="50" cy="50" r="44.4" stroke="#F59E0B" stroke-width="0.7" fill="none"/>
  <!-- Main fill -->
  <circle cx="50" cy="50" r="43"   fill="url(#bg)"/>
  <!-- Shimmer overlay -->
  <circle cx="50" cy="50" r="43"   fill="url(#shimmer)"/>

  <!-- ── Subtle 8-ray sunburst (very faint) ── -->
  <g clip-path="url(#cc)" stroke="white" stroke-width="0.4" opacity="0.07">
    <line x1="50" y1="7" x2="50" y2="93"/>
    <line x1="50" y1="7" x2="50" y2="93" transform="rotate(22.5 50 50)"/>
    <line x1="50" y1="7" x2="50" y2="93" transform="rotate(45 50 50)"/>
    <line x1="50" y1="7" x2="50" y2="93" transform="rotate(67.5 50 50)"/>
  </g>

  <!-- ── Cardinal gold dots (on separator band) ── -->
  <circle cx="50"   cy="6.5"  r="2" fill="#FEF08A"/>
  <circle cx="93.5" cy="50"   r="2" fill="#FEF08A"/>
  <circle cx="50"   cy="93.5" r="2" fill="#FEF08A"/>
  <circle cx="6.5"  cy="50"   r="2" fill="#FEF08A"/>

  <!-- ── Scales of Justice (centered: top y≈27, bottom y≈73, center y≈50) ── -->

  <!-- 4-petal cross pivot ornament -->
  <ellipse cx="50" cy="34" rx="1.8" ry="7"   fill="url(#gold)"/>
  <ellipse cx="50" cy="34" rx="7"   ry="1.8" fill="url(#goldH)"/>
  <circle  cx="50" cy="34" r="3.5"  fill="url(#gold)"/>
  <circle  cx="50" cy="34" r="1.8"  fill="#FEFCE8"/>

  <!-- Balance beam -->
  <rect x="13" y="32.2" width="74" height="3.5" rx="1.75" fill="white"/>

  <!-- Left suspension chain -->
  <rect x="19.5" y="35.7" width="2" height="17" rx="1" fill="white" opacity="0.82"/>
  <!-- Right suspension chain -->
  <rect x="78.5" y="35.7" width="2" height="17" rx="1" fill="white" opacity="0.82"/>

  <!-- Left pan — filled bowl -->
  <path d="M10 52.7 Q20.5 68 31 52.7 Z"          fill="url(#panfill)"/>
  <path d="M10 52.7 Q20.5 68 31 52.7"  stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right pan — filled bowl -->
  <path d="M69 52.7 Q79.5 68 90 52.7 Z"           fill="url(#panfill)"/>
  <path d="M69 52.7 Q79.5 68 90 52.7" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Center post -->
  <rect x="47.5" y="35.7" width="5" height="29" rx="2.5" fill="url(#gold)"/>
  <!-- Post accent diamond (at top of post) -->
  <polygon points="50,36 52.5,40.5 50,45 47.5,40.5" fill="#FEF9C3" opacity="0.75"/>

  <!-- Base platform -->
  <rect x="33" y="63.5" width="34" height="5.2" rx="2.6" fill="url(#gold)"/>
  <!-- Base wide foot -->
  <rect x="27" y="67.5" width="46" height="3.8" rx="1.9" fill="url(#gold)" opacity="0.65"/>

  <!-- Inner subtle decorative ring -->
  <circle cx="50" cy="50" r="43" stroke="#F59E0B" stroke-width="0.4" fill="none" opacity="0.25"/>
</svg>
