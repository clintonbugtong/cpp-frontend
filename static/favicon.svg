<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="childFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M50 4 L84 17 V46 C84 70 69 87 50 96 C31 87 16 70 16 46 V17 Z" fill="url(#shieldFill)"/>
  <path d="M50 4 L84 17 V46 C84 70 69 87 50 96 C31 87 16 70 16 46 V17 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- cradling arcs: two arms sheltering the figure below -->
  <path d="M27 51 C27 76 73 76 73 51" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M35 57 C35 72 65 72 65 57" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="6" stroke-linecap="round"/>

  <!-- the child, in warm contrast to the cool shield -->
  <circle cx="50" cy="35" r="6.5" fill="url(#childFill)"/>
  <path d="M37 63 C37 50 41 45 50 45 C59 45 63 50 63 63 Z" fill="url(#childFill)"/>
</svg>
